<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajan Dünyası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap&subset=latin-ext" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="mapwrap" id="wrap" aria-label="Dünya haritası">
  <svg id="map" role="img" aria-label="Eyaletler, kaynaklar ve stratejik noktalar"></svg>
  <div id="tip" class="tip" hidden></div>
  <header class="top">
    <h1>Ajan Dünyası</h1><div class="date" id="date">Başlangıç</div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="status">Bağlanıyor</span><span id="progress" class="muted"></span></div>
  </header>
  <div class="layers" id="layers" role="group" aria-label="Harita katmanı"></div>
  <div class="zoom"><button id="zin" type="button" aria-label="Yakınlaştır">+</button><button id="zout" type="button" aria-label="Uzaklaştır">−</button><button id="zreset" type="button">Tümü</button></div>
  <div class="legend" id="legend"></div>
</section>
<aside class="drawer" id="drawer">
  <button id="toggle" type="button" class="toggle" aria-label="Paneli aç veya kapat">›</button>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="body" id="body" tabindex="0"></div>
</aside>
<footer class="ruler">
  <button id="pause" type="button">Oyunu durdur</button>
  <button id="prev" type="button" aria-label="Önceki tur">‹</button>
  <div class="track"><div id="marks" class="marks"></div><input id="slider" type="range" min="0" max="0" value="0" aria-label="Tur seç"></div>
  <button id="next" type="button" aria-label="Sonraki tur">›</button>
  <button id="live" type="button" class="on">Canlı izle</button>
</footer>
<script src="app.js" type="module"></script>
</body>
</html>
